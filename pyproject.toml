[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "learningclock"
version = "6.0"
description = "LearningClock Python project."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Vasilis" }
]
dependencies = [
  "fastapi>=0.115",
  "protepo-log @ git+https://github.com/javaboy-vk/Python-Engineering-Lab.git@115ab65d25e445876257b80a623a6d1667ac8cec#subdirectory=packaging/protepo-log",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "debugpy>=1.8",
  "pygount>=1.8",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5"
]

[project.scripts]
learningclock = "learningclock.cli:main"

[project.gui-scripts]
learningclock-gui = "learningclock.desktop:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
learningclock = ["assets/*.ico", "clock.properties"]

[tool.setuptools.data-files]
"learningclock/dashboard_assets" = ["diavgeia/LearningClock/Learning-Clock-Dashboard.md"]
"learningclock/dashboard_assets/views/learning-clock-dashboard" = ["diavgeia/LearningClock/views/learning-clock-dashboard/view.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
cache_dir = "build/.pytest_cache"
addopts = [
  "--strict-markers",
  "--strict-config",
  "--basetemp=build/pytest"
]

[tool.coverage.run]
branch = true
source = ["learningclock"]
data_file = "build/coverage/.coverage"

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.coverage.html]
directory = "build/coverage/html"
extra_css = "docs/assets/coverage-theme.css"
title = "LearningClock Coverage"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
cache-dir = "build/.ruff_cache"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
