name: Project Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build project pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        env:
          GH_TOKEN: ${{ secrets.PROTEPO_LOG_READ_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${GH_TOKEN}" ]]; then
            echo "::error::PROTEPO_LOG_READ_TOKEN is required to install protepo-log from the private Python-Engineering-Lab repository."
            exit 1
          fi
          gh auth setup-git --hostname github.com
          python -m pip install -e ".[dev]"

      - name: Generate HTML coverage
        run: >-
          python -m pytest
          --junitxml=build/tests/junit/pytest-results.xml
          --cov=learningclock
          --cov-report=term-missing
          --cov-report=json:build/coverage/coverage.json
          --cov-report=html:build/coverage/html

      - name: Generate code inventory
        run: python scripts/pygount_summary.py

      - name: Assemble Pages site
        shell: bash
        run: |
          mkdir -p build/pages
          cp build/reports/root-index.html build/pages/index.html
          cp -R build/reports build/pages/reports
          cp -R build/coverage build/pages/coverage
          cp -R build/tests build/pages/tests
          cp -R build/performance build/pages/performance
          cp -R build/benchmarks build/pages/benchmarks
          cp build/reports/pygount-summary.svg build/pages/pygount-summary.svg

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

  deploy:
    name: Deploy project pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
