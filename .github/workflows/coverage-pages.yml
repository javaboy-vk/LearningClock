name: Project Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build project pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Generate HTML coverage
        run: python -m pytest --cov=learningclock --cov-report=term-missing --cov-report=html:build/coverage/html

      - name: Generate code inventory
        run: python scripts/pygount_summary.py

      - name: Assemble Pages site
        shell: bash
        run: |
          mkdir -p build/pages/assets
          cp -R build/coverage/html/. build/pages/
          cp build/reports/pygount-summary.svg build/pages/assets/pygount-summary.svg

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages

  deploy:
    name: Deploy project pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
