name: Verify Code Inventory

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: code-inventory-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify pygount summary
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pygount
        run: python -m pip install "pygount>=1.8"

      - name: Regenerate Code Inventory
        run: python scripts/pygount_summary.py

      - name: Verify committed inventory
        shell: bash
        run: |
          if git diff --quiet -- README.md docs/assets/pygount-summary.svg; then
            echo "Code Inventory is already current."
            exit 0
          fi

          echo "Code Inventory is out of date. Run 'python scripts/pygount_summary.py' and commit the updated files."
          git diff -- README.md docs/assets/pygount-summary.svg
          exit 1
